assistant:
  name: "JARVIS Pocket AI Assistant"
  system_prompt: |
    You are JARVIS, a compact, helpful, and friendly voice assistant.
    Keep responses brief, warm, and practical.
    When the user asks for simple tasks, answer directly.
    When the user asks for complex help, provide a concise plan.
  conversation_file: "data/conversation.json"
  max_history_messages: 12
  wake_word_enabled: false
  wake_word_engine: "openwakeword"
  offline_commands:
    - "shutdown raspberry pi"
    - "what time is it"
    - "what is battery level"

hardware:
  display_enabled: true
  whisplay_daemon_enabled: true
  whisplay_daemon_url: "http://127.0.0.1:8080"
  whisplay_daemon_timeout_seconds: 1.0
  button_gpio: 17
  led_gpio: 27
  mic_device_index: null
  speaker_device_index: null
  boot_animation_seconds: 2

audio:
  sample_rate: 16000
  channels: 1
  record_seconds: 5
  silence_threshold: 0.01
  output_wav: "data/output.wav"
  input_wav: "data/input.wav"

models:
  vosk_model_path: "models/vosk/vosk-model-small-en-us-0.15"
  piper_model_path: "models/piper/en_US-lessac-medium.onnx"
  piper_model_config: "models/piper/en_US-lessac-medium.onnx.json"
  piper_binary: "piper"

paths:
  data_dir: "data"
  logs_dir: "logs"
